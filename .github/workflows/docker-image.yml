name: 构建镜像

# main 更新时自动构建并推送镜像；PR 只构建不推送，用于在合并前验证
# Dockerfile 仍然可用。也可以在 Actions 页面手动触发。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # GHCR 的镜像名必须全小写，而 github.repository 是 falconchen/LitePan，
  # 所以这里写死而不是从上下文取。
  GHCR_IMAGE: ghcr.io/falconchen/litepan
  DOCKERHUB_IMAGE: falconchen/litepan

# 同一分支上只保留最新一次运行，旧的直接取消，避免连续推送时排队浪费额度
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 跟随 go.mod 里声明的版本，避免和 Dockerfile 里的 golang 镜像脱节
          go-version-file: go.mod
          cache: true

      # 与 Dockerfile 保持一致：BUILD_TAGS 默认就是 fuse，
      # 不带这个 tag 编出来的是另一套代码路径，测了也不算数。
      - name: go vet
        run: go vet -tags fuse ./...

      - name: go test
        run: go test -tags fuse ./...

  build:
    name: 构建镜像
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推 GHCR 需要，GITHUB_TOKEN 自动具备
    steps:
      - uses: actions/checkout@v4

      # GHCR 用 GITHUB_TOKEN，零配置，始终可推；
      # Docker Hub 依赖手工配置的 secret，没配就只推 GHCR，不让 CI 变红。
      - name: 决定推送目标
        id: targets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            push=false
            dockerhub=false
          else
            push=true
            [ -n "$DOCKERHUB_TOKEN" ] && dockerhub=true || dockerhub=false
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "dockerhub=$dockerhub" >> "$GITHUB_OUTPUT"

          # metadata-action 会为列出的每个镜像名各生成一套标签
          {
            echo "images<<IMAGES_EOF"
            echo "$GHCR_IMAGE"
            [ "$dockerhub" = "true" ] && echo "$DOCKERHUB_IMAGE"
            echo "IMAGES_EOF"
          } >> "$GITHUB_OUTPUT"

      # 构建 arm64 需要 QEMU 模拟（runner 本身是 x86_64）
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: steps.targets.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        if: steps.targets.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=ref,event=pr

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 那一半是在 QEMU 里模拟执行的，Go 编译和 vite 构建都会明显变慢。
          # 如果构建时间变得难以接受，改用原生 arm64 runner（ubuntu-24.04-arm，
          # 公开仓库免费）分架构构建再合并 manifest，速度接近原生但 workflow 会
          # 复杂不少。
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.targets.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出结果
        run: |
          if [ "${{ steps.targets.outputs.push }}" != "true" ]; then
            echo "仅构建未推送（PR 构建）。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "已推送以下标签：" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' | sed 's/^/  - /' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.targets.outputs.dockerhub }}" != "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "未配置 DOCKERHUB_TOKEN，本次只推了 GHCR。" >> "$GITHUB_STEP_SUMMARY"
          fi
